name: Tests et construction Grocyste

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier les contrats et construire les assets
        run: |
          npm test
          npm run build
      - name: Vérifier les fichiers déclarés
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [line.strip() for line in Path('build-files.txt').read_text().splitlines() if line.strip() and not line.startswith('#')]
          assert len(paths) == len(set(paths))
          assert all(Path(p).is_file() and not Path(p).is_symlink() and '..' not in Path(p).parts for p in paths)
          assert all(not p.startswith(('private/', '.state/', 'tmp/', 'releases/')) for p in paths)
          assert Path('LICENSE').is_file() and Path('PROVENANCE.md').is_file()
          PY
